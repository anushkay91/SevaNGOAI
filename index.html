    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Gracefully handle Vite HMR websocket connection drops in container preview environment
      window.addEventListener('unhandledrejection', event => {
        if (event.reason && event.reason.message && (event.reason.message.includes('WebSocket') || event.reason.message.includes('websocket'))) {
          event.preventDefault();
        }
      });
      const OriginalWS = window.WebSocket;
      if (OriginalWS) {
        window.WebSocket = function(url, protocols) {
          try {
            const ws = new OriginalWS(url, protocols);
            ws.onerror = (err) => {
              // Suppress unhandled HMR socket error logs
            };
            return ws;
          } catch (e) {
            return {
              send: () => {},
              close: () => {},
              addEventListener: () => {},
              removeEventListener: () => {},
              readyState: 3
            };
          }
        };
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
